<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>دليل الواجب - المدرس الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --light-green: #d5f5e3;
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --soft-white: #f0f7f0;
            --warning-yellow: #fff3cd;
            --warning-border: #ffc107;
            --error-red: #e74c3c;
            --info-blue: #3498db;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #e8f5e8 0%, #c8e6c9 100%); 
            margin: 0; 
            padding: 10px; 
            text-align: center; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { 
            max-width: 900px; 
            width: 100%;
            margin: 0 auto; 
            background: var(--white); 
            padding: 20px; 
            border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.2);
            border: 2px solid var(--primary-green);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            background: var(--light-green);
            padding: 12px 15px;
            border-radius: 50px;
            border: 2px solid var(--primary-green);
        }
        h1 { 
            color: var(--dark-green); 
            margin: 0;
            font-size: 2rem;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .settings-icon {
            font-size: 1.8rem;
            color: var(--primary-green);
            cursor: pointer;
            transition: transform 0.3s, color 0.3s;
        }
        .settings-icon:hover {
            transform: rotate(90deg);
            color: var(--dark-green);
        }
        #languageSelect {
            padding: 8px 15px;
            border: 2px solid var(--primary-green);
            border-radius: 30px;
            font-size: 1rem;
            background: var(--white);
            cursor: pointer;
            outline: none;
        }
        .subtitle {
            color: var(--text-light);
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .settings-panel {
            background: var(--soft-white);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
            border: 2px solid var(--primary-green);
        }
        .settings-panel.visible {
            display: block;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .settings-panel input, .settings-panel select {
            padding: 12px;
            border: 2px solid var(--primary-green);
            border-radius: 15px;
            font-size: 14px;
            margin: 5px 0;
            width: 100%;
            background: var(--white);
        }
        .credit-counter {
            background: var(--light-green);
            border-right: 4px solid var(--primary-green);
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark-green);
            flex-wrap: wrap;
        }
        .welcome-message {
            background: var(--light-green);
            border-right: 4px solid var(--primary-green);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.1rem;
            color: var(--dark-green);
            animation: fadeIn 0.5s;
        }
        .question-area {
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--primary-green);
            border-radius: 15px;
            font-size: 16px;
            resize: vertical;
            background: var(--soft-white);
        }
        .file-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
            background: var(--light-green);
            padding: 10px;
            border-radius: 15px;
        }
        .custom-file-upload {
            background: var(--primary-green);
            color: white;
            padding: 12px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            border: none;
            white-space: nowrap;
        }
        .custom-file-upload:hover {
            background: var(--dark-green);
        }
        .file-area input[type="file"] {
            display: none;
        }
        .ocr-status {
            color: var(--primary-green);
            font-size: 0.9rem;
            flex: 1;
            text-align: right;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        button { 
            background: var(--primary-green); 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 1.1rem; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
            flex: 1 1 auto;
            min-width: 160px;
        }
        button:hover { 
            background: var(--dark-green); 
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #resetBtn {
            background-color: var(--info-blue);
        }
        #resetBtn:hover {
            background-color: #2980b9;
        }
        .pitch-btn {
            background: #e67e22;
            box-shadow: 0 4px 10px rgba(230,126,34,0.3);
            text-decoration: none;
            display: inline-block;
            padding: 14px 20px;
            border-radius: 15px;
            font-weight: bold;
            color: white;
        }
        .pitch-btn:hover {
            background: #d35400;
            transform: translateY(-2px);
        }
        .chat-box { 
            margin-top: 20px; 
            padding: 15px; 
            background: var(--light-gray); 
            border-radius: 20px; 
            text-align: right; 
            min-height: 250px;
            border-right: 4px solid var(--primary-green);
            overflow-y: auto;
            max-height: 400px;
        }
        .message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 18px;
            max-width: 90%;
            clear: both;
            word-wrap: break-word;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .teacher {
            background: #e1f0fa;
            border-right: 4px solid var(--info-blue);
            margin-left: auto;
            flex-direction: row;
        }
        .student {
            background: var(--light-green);
            border-left: 4px solid var(--primary-green);
            margin-right: auto;
            flex-direction: row-reverse;
        }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar svg {
            width: 90%;
            height: 90%;
        }
        .message-content {
            flex: 1;
            font-size: 1rem;
        }
        .hint { 
            color: var(--error-red); 
            font-weight: bold;
            margin-left: 5px;
        }
        .tip-box {
            background: var(--warning-yellow);
            border-right: 4px solid var(--warning-border);
            padding: 15px;
            border-radius: 15px;
            margin: 20px 0 10px;
            text-align: right;
            animation: fadeIn 0.5s;
            font-size: 1.1rem;
            color: #856404;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .tip-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffecb3;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .tip-avatar svg {
            width: 90%;
            height: 90%;
        }
        .tip-text {
            flex: 1;
            min-width: 200px;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .student-input-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .student-input-area input {
            flex: 1 1 200px;
            padding: 14px;
            border: 2px solid var(--primary-green);
            border-radius: 15px;
            font-size: 16px;
            background: var(--soft-white);
            min-width: 150px;
        }
        .student-input-area button {
            flex: 0 1 auto;
            min-width: 120px;
            white-space: nowrap;
        }
        #tipContainer {
            min-height: 80px;
        }
        .footer-links {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .footer-links a {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s;
            border: 2px solid var(--primary-green);
            background: var(--white);
            color: var(--dark-green);
        }
        .footer-links a:hover {
            background: var(--light-green);
            transform: translateY(-2px);
        }
        .footer-links .donate-link {
            background: #ffaa33;
            border-color: #ff8c42;
            color: #4b2e1a;
        }
        .footer-links .donate-link:hover {
            background: #ff9f1a;
        }
        /* تذييل Runway */
        .footer-runway {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e6ed;
            text-align: center;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        .footer-runway img {
            width: 60px;
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            body { padding: 5px; }
            .container { padding: 15px; }
            h1 { font-size: 1.8rem; }
            .header { padding: 10px; }
            .header-controls { width: 100%; }
            #languageSelect { width: 100%; }
            .settings-icon { align-self: center; }
            .button-group button { width: 100%; }
            .student-input-area button { width: 100%; }
            .footer-links a { width: 100%; text-align: center; }
            .tip-box { flex-direction: column; text-align: center; }
            .tip-avatar { margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="mainTitle">🧑‍🏫 دليل الواجب</h1>
            <div class="header-controls">
                <select id="languageSelect">
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="uk">🇺🇦 Українська</option>
                    <option value="sq">🇦🇱 Shqip</option>
                </select>
                <i class="fas fa-cog settings-icon" id="settingsToggle" title="إعدادات المطور"></i>
            </div>
        </div>
        <p class="subtitle" id="subTitle">لا نعطيك الإجابة، نعلمك كيف تفكر!</p>
        
        <div class="settings-panel" id="settingsPanel">
            <input type="text" id="apiKeyInput" placeholder="مفتاح Gemini API" value="AIzaSyAoAd5BjCY3SPAhQlOduNezucJ-Wz9LV2E">
            <select id="modelSelect">
                <option value="gemini-2.0-flash">⚡ Gemini 2.0 Flash</option>
                <option value="gemini-2.5-flash" selected>✨ Gemini 2.5 Flash</option>
                <option value="gemini-2.5-pro">🚀 Gemini 2.5 Pro</option>
            </select>
            <div class="credit-counter">
                <i class="fas fa-chart-line"></i>
                <span id="creditDisplay">الرصيد التقريبي: 60 طلب متبقي</span>
            </div>
            <p style="font-size:0.8rem; color:var(--text-light);">* يُعاد تعيين العداد كل دقيقة.</p>
        </div>

        <div id="welcomeMessage" class="welcome-message"></div>
        
        <div class="question-area">
            <textarea id="questionInput" rows="3" placeholder="اكتب سؤالك هنا ..."></textarea>
        </div>
        
        <div class="file-area">
            <label for="imageInput" class="custom-file-upload" id="customFileLabel">📸 اختر صورة</label>
            <input type="file" id="imageInput" accept="image/*">
            <div id="ocrStatus" class="ocr-status"></div>
        </div>
        
        <div class="button-group">
            <button onclick="startNewQuestion()" id="startBtn">🔍 ابدأ المحادثة</button>
            <button onclick="resetConversation()" id="resetBtn">🔄 بداية جديدة</button>
            <a href="pitch.html" class="pitch-btn">🎬 مشاهدة العرض</a>
        </div>
        
        <div class="chat-box" id="chatBox" style="display: none;">
            <div id="messages"></div>
        </div>
        
        <div id="tipContainer" class="tip-box" style="display: none;">
            <div id="tipAvatar" class="tip-avatar"></div>
            <div class="tip-text">
                <span id="tipText"></span>
            </div>
        </div>
        
        <div id="studentArea" style="display: none;" class="student-input-area">
            <input type="text" id="studentAnswer" placeholder="اكتب إجابتك هنا...">
            <button onclick="sendStudentAnswer()" id="sendBtn">إرسال إجابتي</button>
        </div>

        <div class="footer-links">
            <a href="help.html" target="_blank" id="helpLink">📘❓ دليل الاستخدام (للأهل) </a>
            <a href="https://paypal.me/forALLRefugees" target="_blank" class="donate-link" id="donateLink">💖 دعم التطبيق (تبرع)</a>
        </div>

        <!-- تذييل Runway -->
        <div class="footer-runway">
            <div style="margin-bottom: 8px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Runway_ML_logo.svg/256px-Runway_ML_logo.svg.png" alt="Runway Logo">
            </div>
            <p>تم التقديم لمسابقة Big Pitch Challenge</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.0/dist/tesseract.min.js"></script>
    
    <script>
        // ========== عناصر الصفحة ==========
        const apiKeyInput = document.getElementById('apiKeyInput');
        const modelSelect = document.getElementById('modelSelect');
        const languageSelect = document.getElementById('languageSelect');
        const questionInput = document.getElementById('questionInput');
        const imageInput = document.getElementById('imageInput');
        const ocrStatus = document.getElementById('ocrStatus');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const chatBox = document.getElementById('chatBox');
        const messagesDiv = document.getElementById('messages');
        const studentArea = document.getElementById('studentArea');
        const studentAnswer = document.getElementById('studentAnswer');
        const sendBtn = document.getElementById('sendBtn');
        const tipContainer = document.getElementById('tipContainer');
        const tipText = document.getElementById('tipText');
        const tipAvatar = document.getElementById('tipAvatar');
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const welcomeMessageDiv = document.getElementById('welcomeMessage');
        const customFileLabel = document.getElementById('customFileLabel');
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPanel = document.getElementById('settingsPanel');
        const creditDisplay = document.getElementById('creditDisplay');
        const helpLink = document.getElementById('helpLink');
        const donateLink = document.getElementById('donateLink');

        // ========== عداد الرصيد ==========
        let requestCount = 0;
        const MAX_REQUESTS_PER_MINUTE = 60;
        let creditTimer = null;

        function updateCreditDisplay() {
            const remaining = Math.max(0, MAX_REQUESTS_PER_MINUTE - requestCount);
            const lang = languageSelect.value;
            if (lang === 'ar') creditDisplay.innerText = `الرصيد التقريبي: ${remaining} طلب متبقي هذا الدقيقة`;
            else if (lang === 'en') creditDisplay.innerText = `Estimated credit: ${remaining} requests left this minute`;
            else if (lang === 'uk') creditDisplay.innerText = `Орієнтовний кредит: ${remaining} запитів залишилось цієї хвилини`;
            else if (lang === 'sq') creditDisplay.innerText = `Krediti i përafërt: ${remaining} kërkesa të mbetura këtë minutë`;
        }

        function resetRequestCount() {
            requestCount = 0;
            updateCreditDisplay();
        }

        function startCreditTimer() {
            if (creditTimer) clearInterval(creditTimer);
            creditTimer = setInterval(resetRequestCount, 60000);
        }

        function incrementRequestCount() {
            requestCount++;
            updateCreditDisplay();
        }

        settingsToggle.addEventListener('click', () => {
            settingsPanel.classList.toggle('visible');
        });

        // ========== قائمة النصائح التربوية ==========
        const educationalTips = {

        // ========== شخصيات SVG ==========
        const teacherSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="40" r="25" fill="#FFB6C1" stroke="#333" stroke-width="2"/>
                <circle cx="35" cy="35" r="4" fill="black"/>

                <text x="50" y="110" font-size="12" text-anchor="middle" fill="black">المعلم</text>

        `;

        const studentSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

                <circle cx="55" cy="87" r="6" fill="#8B4513"/>
                <rect x="25" y="52" width="50" height="6" fill="#CD853F" rx="3"/>
                <path d="M30 20 L45 5 L55 5 L70 20" fill="#FF8C00" opacity="0.6"/>
                <text x="50" y="110" font-size="12" text-anchor="middle" fill="black">الطالب</text>
            </svg>
        `;

        // 10 شخصيات عشوائية (مختصرة للطول)
        const randomCharacters = [
            `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="#FF6F61"/><circle cx="35" cy="35" r="4" fill="white"/><circle cx="65" cy="35" r="4" fill="white"/><circle cx="35" cy="35" r="2" fill="black"/><circle cx="65" cy="35" r="2" fill="black"/><path d="M40 55 Q50 70, 60 55" stroke="black" fill="none" stroke-width="3"/><rect x="30" y="70" width="40" height="20" fill="#A0522D"/><circle cx="45" cy="90" r="5" fill="#8B4513"/><circle cx="55" cy="90" r="5" fill="#8B4513"/></svg>`,
            `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="#FFB347"/><circle cx="35" cy="35" r="4" fill="white"/><circle cx="65" cy="35" r="4" fill="white"/><circle cx="35" cy="35" r="2" fill="black"/><circle cx="65" cy="35" r="2" fill="black"/><polygon points="40,55 60,55 50,70" fill="#FF6346"/><rect x="40" y="70" width="20" height="25" fill="#FFD700"/><circle cx="45" cy="95" r="6" fill="#8B4513"/><circle cx="55" cy="95" r="6" fill="#8B4513"/></svg>`,
            `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="#90EE90"/><circle cx="35" cy="35" r="4" fill="white"/><circle cx="65" cy="35" r="4" fill="white"/><circle cx="35" cy="35" r="2" fill="black"/><circle cx="65" cy="35" r="2" fill="black"/><ellipse cx="50" cy="55" rx="12" ry="8" fill="#FF69B4"/><rect x="35" y="70" width="30" height="25" fill="#32CD32"/><circle cx="45" cy="95" r="6" fill="#8B4513"/><circle cx="55" cy="95" r="6" fill="#8B4513"/></svg>`,
            `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="#FFDAB9"/><circle cx="35" cy="35" r="4" fill="white"/><circle cx="65" cy="35" r="4" fill="white"/><circle cx="35" cy="35" r="2" fill="black"/><circle cx="65" cy="35" r="2" fill="black"/><ellipse cx="50" cy="55" rx="10" ry="6" fill="#FF6346"/><rect x="40" y="70" width="20" height="25" fill="#FFA07A"/><circle cx="45" cy="95" r="6" fill="#8B4513"/><circle cx="55" cy="95" r="6" fill="#8B4513"/><ellipse cx="50" cy="25" rx="10" ry="5" fill="#FFD700"/></svg>`,
            `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="#87CEEB"/><circle cx="35" cy="35" r="4" fill="white"/><circle cx="65" cy="35" r="4" fill="white"/><circle cx="35" cy="35" r="2" fill="black"/><circle cx="65" cy="35" r="2" fill="black"/><path d="M40 55 L60 55 L55 70 L45 70 Z" fill="#FF6346"/><rect x="35" y="70" width="30" height="25" fill="#4682B4"/><circle cx="45" cy="95" r="6" fill="#8B4513"/><circle cx="55" cy="95" r="6" fill="#8B4513"/></svg>`
        ];

        // ========== متغيرات الحالة ==========
        let conversationHistory = [];
        let currentQuestion = '';

        // ========== تحديث واجهة المستخدم حسب اللغة ==========
        function updateUILanguage() {
            const lang = languageSelect.value;
            const t = translations[lang];
            
            mainTitle.textContent = t.mainTitle;
            subTitle.textContent = t.subTitle;
            welcomeMessageDiv.textContent = t.welcome;
            questionInput.placeholder = t.questionPlaceholder;
            customFileLabel.textContent = t.customFile;
            startBtn.innerHTML = t.startBtn;
            resetBtn.innerHTML = t.resetBtn;
            studentAnswer.placeholder = t.studentAnswerPlaceholder;
            sendBtn.textContent = t.sendBtn;
            helpLink.textContent = t.helpLink;
            donateLink.textContent = t.donateLink;
            updateCreditDisplay();
        }

        languageSelect.addEventListener('change', updateUILanguage);

        window.addEventListener('load', () => {
            updateUILanguage();
            startCreditTimer();
        });

        // ========== دوال OCR والمحادثة ==========
        async function extractTextFromImage(file, langCode) {
            const t = translations[languageSelect.value];
            return new Promise((resolve, reject) => {
                ocrStatus.innerText = t.ocrStart;
                Tesseract.recognize(
                    file,
                    langCode,
                    { logger: m => { if (m.status === 'recognizing text') { ocrStatus.innerText = t.ocrProgress + Math.round(m.progress * 100) + '%'; } } }
                ).then(({ data: { text } }) => {
                    ocrStatus.innerText = t.ocrSuccess;
                    resolve(text.trim());
                }).catch(err => {
                    ocrStatus.innerText = t.ocrFail;
                    reject(err);
                });
            });
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            if (sender === 'teacher') avatarDiv.innerHTML = teacherSVG;
            else avatarDiv.innerHTML = studentSVG;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = text;
            
            msgDiv.appendChild(avatarDiv);
            msgDiv.appendChild(contentDiv);
            
            messagesDiv.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showRandomTip() {
            const lang = languageSelect.value;
            const tips = educationalTips[lang] || educationalTips['ar'];
            const randomIndex = Math.floor(Math.random() * tips.length);
            tipText.textContent = tips[randomIndex];
            
            const randomCharIndex = Math.floor(Math.random() * randomCharacters.length);
            tipAvatar.innerHTML = randomCharacters[randomCharIndex];
            
            tipContainer.style.display = 'flex';
        }

        function hideTip() {
            tipContainer.style.display = 'none';
        }

        function resetConversation() {
            messagesDiv.innerHTML = '';
            conversationHistory = [];
            currentQuestion = '';
            chatBox.style.display = 'none';
            studentArea.style.display = 'none';
            questionInput.value = '';
            studentAnswer.value = '';
            imageInput.value = '';
            ocrStatus.innerText = '';
            hideTip();
        }

        async function startNewQuestion() {
            let question = questionInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            const model = modelSelect.value;
            const lang = languageSelect.value;
            const imageFile = imageInput.files[0];
            const t = translations[lang];

            if (!apiKey) { alert(t.noApiKey); return; }
            if (!question && !imageFile) { alert(t.noQuestion); return; }

            if (imageFile) {
                try {
                    const extractedText = await extractTextFromImage(imageFile, lang);
                    if (extractedText) {
                        question = question ? `${question}\n\n(${t.ocrSuccess}: ${extractedText})` : extractedText;
                    }
                } catch (error) {
                    alert(t.ocrFail + ': ' + error.message);
                    return;
                }
            }

            chatBox.style.display = 'block';
            studentArea.style.display = 'flex';
            messagesDiv.innerHTML = '';
            conversationHistory = [];
            currentQuestion = question;
            hideTip();
            addMessage(question, 'student');
            await sendToAI(question, true, lang);
        }

        async function sendStudentAnswer() {
            const answer = studentAnswer.value.trim();
            const t = translations[languageSelect.value];
            if (!answer) { alert(t.noAnswer); return; }
            addMessage(answer, 'student');
            studentAnswer.value = '';
            await sendToAI(answer, false, languageSelect.value);
        }

        async function sendToAI(userInput, isFirstMessage, lang) {
            const apiKey = apiKeyInput.value.trim();
            const model = modelSelect.value;
            const maxTokens = 65536;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const t = translations[lang];

            if (requestCount >= MAX_REQUESTS_PER_MINUTE) {
                alert(t.error429);
                return;
            }

            startBtn.disabled = true;
            sendBtn.disabled = true;
            resetBtn.disabled = true;

            const typingMsg = document.createElement('div');
            typingMsg.className = 'message teacher';
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.innerHTML = teacherSVG;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = t.typing + ' <span class="loading-spinner"></span>';
            typingMsg.appendChild(avatarDiv);
            typingMsg.appendChild(contentDiv);
            messagesDiv.appendChild(typingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            let systemPrompt = '';
            if (isFirstMessage) {
                systemPrompt = `أنت مدرس ذكي ومشجع للأطفال (تحت 18 سنة). مهمتك تقديم تلميحات تدريجية ومفصلة للطالب حول سؤاله في أي مادة (رياضيات، علوم، تاريخ، لغة، جغرافيا، ...) دون إعطاء الحل مباشرة. ابدأ بالترحيب بحرارة، ثم اشرح أول تلميحة بطريقة مبسطة ومناسبة لعمره. كن دقيقاً واكتب جملًا كاملة. لا تذكر أي نصائح تربوية مثل شرب الماء أو تنظيف الأسنان، ركز فقط على التلميحات التعليمية. يجب أن تكتب الردود بلغة المستخدم (${lang}) التي اختارها. السؤال: ${currentQuestion}`;
            } else {
                let conversationText = '';
                conversationHistory.forEach(msg => { conversationText += `${msg.role}: ${msg.content}\n`; });
                systemPrompt = `أنت مدرس ذكي. تتابع محادثة مع طالب (تحت 18 سنة) حول السؤال: "${currentQuestion}" في أي مادة. حتى الآن تبادلتما ما يلي:\n${conversationText}\nالآن الطالب أرسل إجابته: "${userInput}". قم بتحليل إجابته بدقة:
- إذا كانت الإجابة صحيحة تماماً وكاملة، فابدأ بكلمة "أحسنت!" أو "ممتاز!" ثم امدحه بحرارة على فهمه، ثم في نهاية ردك أضف العبارة التالية بالضبط: "[تم الحل]"
- إذا كانت الإجابة غير صحيحة أو ناقصة، قدم له تلميحة إضافية تساعده على التفكير، دون إعطاء الحل الكامل. ولا تضف [تم الحل].
- إذا كانت الإجابة قريبة من الصحة، شجعه ووجهه خطوة إضافية.
اكتب ردودك كاملة ومفصلة، واقتصصر على التوجيه التعليمي فقط. يجب أن تكتب الردود بلغة المستخدم (${lang}) التي اختارها.`;
            }

            try {
                incrementRequestCount();
                const response = await axios.post(url, {
                    contents: [{
                        parts: [{ text: systemPrompt }]
                    }],
                    safetySettings: [{
                        category: "HARM_CATEGORY_DANGEROUS_CONTENT",
                        threshold: "BLOCK_NONE"
                    }],
                    generationConfig: { temperature: 0.7, topP: 0.95, maxOutputTokens: maxTokens }
                }, { headers: { "Content-Type": "application/json" } });

                messagesDiv.removeChild(typingMsg);
                let answer = response.data.candidates[0].content.parts[0].text;
                const displayAnswer = answer.replace('[تم الحل]', '');
                addMessage(displayAnswer, 'teacher');

                if (isFirstMessage) {
                    conversationHistory.push({ role: 'طالب', content: currentQuestion });
                    conversationHistory.push({ role: 'مدرس', content: answer });
                } else {
                    conversationHistory.push({ role: 'طالب', content: userInput });
                    conversationHistory.push({ role: 'مدرس', content: answer });
                }

                if (answer.includes('[تم الحل]')) showRandomTip();
                else hideTip();
            } catch (error) {
                if (typingMsg.parentNode) messagesDiv.removeChild(typingMsg);
                console.error(error);
                let errorMsg = error.message;
                if (error.response) {
                    if (error.response.status === 429) errorMsg = t.error429;
                    else if (error.response.status === 403) errorMsg = t.error403;
                    else if (error.response.data?.error?.message) errorMsg = error.response.data.error.message;
                }
                addMessage(`⚠️ ${t.error}: ${errorMsg}`, 'teacher');
            } finally {
                startBtn.disabled = false;
                sendBtn.disabled = false;
                resetBtn.disabled = false;
            }
        }
    </script>
